; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs =   NerminerV2

[env:NerminerV2]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_filters = 
	esp32_exception_decoder
	time
	log2file
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
upload_speed = 115200

# 2 x 4.5MB app, 6.875MB SPIFFS
;board_build.partitions = large_spiffs_16MB.csv
;board_build.partitions = default_8MB.csv
board_build.partitions = huge_app.csv
;board_build.partitions = default.csv
	
build_flags = 
	-D LV_LVGL_H_INCLUDE_SIMPLE
	-D BOARD_HAS_PSRAM
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D NERDMINERV2=1
	;-D DEBUG_MINING=1
lib_deps = 
	https://github.com/takkaO/OpenFontRender.git#c63d691
	bblanchon/ArduinoJson@^6.21.2
	https://github.com/tzapu/WiFiManager.git
	mathertel/OneButton @ ^2.0.3
	arduino-libraries/NTPClient
	;https://github.com/golden-guy/Arduino_wolfssl.git#v5.5.4

[env:NyanMiner-S3-AMOLED]
platform = espressif32
board = lilygo-t-amoled
framework = arduino
monitor_filters = 
	esp32_exception_decoder
	time
	log2file

board_build.partitions = huge_app.csv

build_flags = 
    -DNYANMINER_S3_AMOLED
    -DARDUINO_USB_CDC_ON_BOOT	
    -DBOARD_HAS_PSRAM
	  -DCONFIG_SPIRAM_SUPPORT ;Enable SPIRAM support for TFT_eSPI
	  -DARDUINO_M5_SERIES		;Enable SPIRAM support for OpenFontRender
    -O3
	  ;-DCORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_INFO
	  ;-DDEBUG_MEMORY	

lib_deps = 
	https://github.com/takkaO/OpenFontRender.git#c63d691
	bblanchon/ArduinoJson@^6.21.2
	https://github.com/tzapu/WiFiManager.git
	mathertel/OneButton @ ^2.0.3
	arduino-libraries/NTPClient
  https://github.com/bitbank2/AnimatedGIF

; E2E test build — connects to local mock pool instead of production
; Based on NyanMiner-S3-AMOLED + TEST_POOL override
; Usage: 1) node test/e2e_stratum/mock_pool.js
;        2) pio run -e NyanMiner-E2E -t upload -t monitor
[env:NyanMiner-E2E]
platform = espressif32
board = lilygo-t-amoled
framework = arduino
monitor_filters =
	esp32_exception_decoder
	time
	log2file
board_build.partitions = huge_app.csv
build_flags =
    -DNYANMINER_S3_AMOLED
    -DARDUINO_USB_CDC_ON_BOOT
    -DBOARD_HAS_PSRAM
    -DCONFIG_SPIRAM_SUPPORT
    -DARDUINO_M5_SERIES
    -O3
    -DTEST_POOL
    -DTEST_POOL_HOST=\"192.168.1.100\"
    -DTEST_POOL_PORT=3333
    ; Block 125552 replay
    ; -DTEST_POOL_EXTRANONCE2=\"1a022a01\"
    ; -DTEST_POOL_NONCE=0x9546a142
    ;
    ;Block 100000 replay
    ; -DTEST_POOL_EXTRANONCE2=\"1b020602\"
    ; -DTEST_POOL_NONCE=0x10572b0f
    -DDEBUG_MINING=1
lib_deps =
	https://github.com/takkaO/OpenFontRender.git#c63d691
	bblanchon/ArduinoJson@^6.21.2
	https://github.com/tzapu/WiFiManager.git
	mathertel/OneButton @ ^2.0.3
	arduino-libraries/NTPClient
	https://github.com/bitbank2/AnimatedGIF

[env:native]
platform = native
build_flags =
    -I test/stubs
    -std=c++17
    -Wno-array-bounds
    -Wno-unused-variable
    -DIRAM_ATTR=
    -DDRAM_ATTR=
    -fno-stack-protector
test_build_src = true
build_src_filter =
    +<ShaTests/nerdSHA256plus.cpp>
    +<mining_core.cpp>
